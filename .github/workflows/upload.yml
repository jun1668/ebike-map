name: 上传体验版

# 推送 tag 时自动构建上传体验版；也可以在 Actions 页面手动触发
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 结构自查
        run: node scripts/validate.js

      - name: 云函数业务测试
        run: node scripts/test-cloudfunctions.js

      - name: 写入上传密钥
        run: |
          mkdir -p keys
          echo "${{ secrets.WX_PRIVATE_KEY }}" > keys/private.${{ secrets.WX_APPID }}.key

      - name: 上传体验版
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY_PATH: keys/private.${{ secrets.WX_APPID }}.key
          VERSION: ${{ github.ref_name }}
        run: node scripts/ci-upload.js

      - name: 清理密钥
        if: always()
        run: rm -rf keys
